<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc"><title id="title">LSTM: summarize a history through a sequence of memory updates</title><desc id="desc">Three illustrated time steps share one LSTM model. Daily inputs enter at each step. Cell state and hidden state pass forward, and the final hidden state gives one forecast. Intermediate time steps are omitted.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="600" fill="white"/>
