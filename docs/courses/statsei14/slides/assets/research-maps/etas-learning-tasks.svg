<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650" role="img" aria-labelledby="title desc"><title id="title">One ETAS map sequence, two learning tasks</title><desc id="desc">A Chilean catalogue supplies a temporal ETAS fit with parameters estimated across the area and shared across one-degree cells. Daily conditional-intensity maps support two branches. Thirty daily spatial maxima enter an LSTM to predict the next maximum. Thirty maps enter a CNN to classify the six latitudinal macrozones of the next maximum. The colored grid is schematic.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs><rect width="1800" height="650" fill="white"/>
<text x="900" y="50" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#263238">A common representation, two target definitions</text>
<rect x="25" y="235" width="275" height="180" rx="18" fill="#EDF3FB" stroke="#5A8ECE" stroke-width="3"/>
<text x="162" y="286" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle" fill="#5A8ECE">CSN catalogue</text>
<text x="162" y="333" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263238">Times, locations</text>
<text x="162" y="376" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263238">and magnitudes</text>
<path d="M312 325 L357 325" fill="none" stroke="#5A8ECE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="370" y="215" width="310" height="220" rx="18" fill="#E6F5F3" stroke="#00A499" stroke-width="3"/>
<text x="525" y="267" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#00A499">Temporal ETAS</text>
<text x="525" y="319" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263238">Fit across the area</text>
<text x="525" y="365" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263238">Shared parameters</text>
<text x="525" y="407" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263238">for every grid cell</text>
<path d="M692 325 L737 325" fill="none" stroke="#00A499" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="920" y="148" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" text-anchor="middle" fill="#00A499">Daily intensity maps</text>
<rect x="816" y="177" width="230" height="230" fill="white" stroke="#00A499" stroke-width="3"/>
<rect x="793" y="201" width="230" height="230" fill="white" stroke="#00A499" stroke-width="3"/>
<rect x="770" y="225" width="230" height="230" fill="white" stroke="#00A499" stroke-width="3"/>
<rect x="776" y="231" width="53" height="53" fill="#EDF8F7"/>
<rect x="831" y="231" width="53" height="53" fill="#D3EFEC"/>
<rect x="886" y="231" width="53" height="53" fill="#A6DDD7"/>
<rect x="941" y="231" width="53" height="53" fill="#70C7BD"/>
<rect x="776" y="286" width="53" height="53" fill="#D3EFEC"/>
<rect x="831" y="286" width="53" height="53" fill="#A6DDD7"/>
<rect x="886" y="286" width="53" height="53" fill="#70C7BD"/>
<rect x="941" y="286" width="53" height="53" fill="#EDF8F7"/>
<rect x="776" y="341" width="53" height="53" fill="#A6DDD7"/>
<rect x="831" y="341" width="53" height="53" fill="#70C7BD"/>
<rect x="886" y="341" width="53" height="53" fill="#EDF8F7"/>
<rect x="941" y="341" width="53" height="53" fill="#D3EFEC"/>
<rect x="776" y="396" width="53" height="53" fill="#70C7BD"/>
<rect x="831" y="396" width="53" height="53" fill="#EDF8F7"/>
<rect x="886" y="396" width="53" height="53" fill="#D3EFEC"/>
<rect x="941" y="396" width="53" height="53" fill="#A6DDD7"/>
<text x="898" y="505" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="400" text-anchor="middle" fill="#607D8B">1° × 1° cells</text>
<text x="898" y="547" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" text-anchor="middle" fill="#607D8B">Schematic map sequence</text>
<path d="M1057 315 L1095 315 L1095 170 L1145 170" fill="none" stroke="#00A499" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1057 315 L1095 315 L1095 465 L1145 465" fill="none" stroke="#EA7600" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1160" y="72" width="610" height="208" rx="18" fill="#E6F5F3" stroke="#00A499" stroke-width="3"/>
<text x="1465" y="120" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" text-anchor="middle" fill="#00A499">Temporal branch: LSTM</text>
<text x="1465" y="169" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#263238">30 daily spatial maxima</text>
<text x="1465" y="217" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#263238">Predict the next-day maximum</text>
<text x="1465" y="259" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle" fill="#00A499">Regression</text>
<rect x="1160" y="365" width="610" height="208" rx="18" fill="#FFF0E4" stroke="#EA7600" stroke-width="3"/>
<text x="1465" y="413" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="700" text-anchor="middle" fill="#EA7600">Spatial branch: CNN</text>
<text x="1465" y="462" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="400" text-anchor="middle" fill="#263238">30 daily intensity maps</text>
<text x="1465" y="510" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="400" text-anchor="middle" fill="#263238">Predict the macrozone of the maximum</text>
<text x="1465" y="552" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle" fill="#EA7600">Six-class classification</text>
<text x="900" y="625" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle" fill="#263238">Both targets describe the estimated ETAS intensity.</text>
</svg>
