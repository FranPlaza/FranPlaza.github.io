<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc"><title id="title">A compact Transformer for the same 30-day catalogue history</title><desc id="desc">Thirty days by three channels enter a dense projection to sixteen features and learned day-position embeddings. One Transformer block has two attention heads of dimension eight, residual addition and layer normalization, a 16 to 16 feed-forward network, and a second residual addition and layer normalization. Global average pooling and a sigmoid produce next-week occurrence probability. All input positions precede the forecast origin.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="600" fill="white"/>
