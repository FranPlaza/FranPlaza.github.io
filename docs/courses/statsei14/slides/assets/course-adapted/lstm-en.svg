<path d="M1265,262 L1350,262" fill="none" stroke="#EA7600" stroke-width="5" opacity="1" stroke-linecap="round" marker-end="url(#a)"/>
<text x="1440" y="140" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" text-anchor="middle" fill="#EA7600">Dense + sigmoid</text>
