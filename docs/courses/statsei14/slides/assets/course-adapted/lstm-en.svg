<text x="1478" y="250" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="600" text-anchor="middle" fill="#EA7600">p</text>
<text x="1478" y="298" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" text-anchor="middle" fill="#EA7600">Next week</text>
<text x="800" y="550" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#263238">Daily features: log(1 + count), maximum magnitude excess above 4.5</text>
<text x="800" y="591" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#263238">and an event indicator. Catalogue inputs use M ≥ 4.5.</text>
