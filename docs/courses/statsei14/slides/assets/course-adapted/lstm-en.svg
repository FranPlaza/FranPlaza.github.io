<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc"><title id="title">LSTM: 30 days of catalogue features produce a weekly occurrence probability</title><desc id="desc">Each of 30 days has three catalogue channels: log(1 + count), maximum magnitude excess above 4.5 and an event indicator. Shared LSTM updates build a final state of 16 values. Dense plus sigmoid transforms it into the probability of at least one catalogue M &gt;= 5 event in the next seven days. Intermediate time steps are omitted.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="600" fill="white"/>
<text x="800" y="50" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#263238">Input: 30 days × 3 catalogue channels</text>
<rect x="125" y="410" width="220" height="98" rx="22" fill="#EDF3FB" stroke="#5A8ECE" stroke-width="4"/>
<path d="M146,412 Q230.6,408 326,412 M344,432 Q347,457.04 343,487" fill="none" stroke="#5A8ECE" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
