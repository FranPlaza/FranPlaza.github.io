<path d="M531,192 Q630.0,188 741,192 M759,212 Q762,258.64 758,312" fill="none" stroke="#00A499" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="635" y="276" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="middle" fill="#00A499">LSTM</text>
<path d="M635,405 L635,343" fill="none" stroke="#5A8ECE" stroke-width="4" opacity="1" stroke-linecap="round" marker-end="url(#a)"/>
