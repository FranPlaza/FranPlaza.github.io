<rect x="110" y="190" width="250" height="143" rx="22" fill="#E6F5F3" stroke="#00A499" stroke-width="4"/>
<path d="M131,192 Q230.0,188 341,192 M359,212 Q362,258.64 358,312" fill="none" stroke="#00A499" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="235" y="276" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" text-anchor="middle" fill="#00A499">LSTM</text>
<path d="M235,405 L235,343" fill="none" stroke="#5A8ECE" stroke-width="4" opacity="1" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="525" y="410" width="220" height="98" rx="22" fill="#EDF3FB" stroke="#5A8ECE" stroke-width="4"/>
<path d="M546,412 Q630.6,408 726,412 M744,432 Q747,457.04 743,487" fill="none" stroke="#5A8ECE" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
